[package]
name = "gdc-metadata-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scan, normalise, match and export camera metadata (GDC Metadata core)"

[lib]
name = "gdc_metadata_core"
path = "src/lib.rs"

[[bin]]
name = "gdc-metadata-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
